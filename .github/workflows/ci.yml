name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest   # Docker is available here, so Testcontainers can start PostgreSQL and RabbitMQ
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  # Migrations as a separate deploy step: verify the model matches the migrations, build a self-contained
  # migration bundle (no SDK needed on the server), prove it applies to a fresh PostgreSQL, publish it.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - run: dotnet tool install --global dotnet-ef --version 9.0.9
      - run: dotnet build TaskApi/TaskApi.csproj --configuration Release

      # Fails the build if someone changed the entity mapping without adding a migration.
      - run: dotnet ef migrations has-pending-model-changes --project TaskApi --configuration Release --no-build

      - run: dotnet ef migrations bundle --project TaskApi --configuration Release --self-contained -r linux-x64 -o efbundle --force

      # Dry run against a throw-away database: the same command the deploy step would run on the server.
      - run: ./efbundle --connection "Host=localhost;Port=5432;Database=taskapi;Username=postgres;Password=postgres"

      - uses: actions/upload-artifact@v4
        with:
          name: efbundle-linux-x64
          path: efbundle

  # Auto-deploy to the VPS on every green push to main: image is built here, shipped as a tarball over
  # SSH (no registry needed), migrations applied with the bundle, then the API container is rolled out.
  deploy:
    needs: [test, migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: efbundle-linux-x64
          path: out

      - name: Build image
        run: |
          docker build -f TaskApi/Dockerfile -t taskapi:${{ github.sha }} .
          docker save taskapi:${{ github.sha }} | gzip > out/image.tar.gz
          ls -lh out

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Ship and deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp out/image.tar.gz out/efbundle deploy/deploy.sh root@"$HOST":/opt/taskapi/
          scp deploy/docker-compose.prod.yml root@"$HOST":/opt/taskapi/docker-compose.yml
          ssh root@"$HOST" "bash /opt/taskapi/deploy.sh ${{ github.sha }}"

      - name: Smoke test over HTTPS
        run: curl -fsS --retry 5 --retry-delay 3 https://api.finito.zatr1k.pro/health && echo
